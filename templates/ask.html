<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask BookGenie - AI Book Discovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .message-bubble {
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .typing-indicator {
            display: inline-flex;
            gap: 4px;
        }
        
        .typing-indicator span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.6);
            animation: bounce 1.4s infinite;
        }
        
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 text-white min-h-screen">


<!-- ─── NAVBAR ─── -->
<nav class="bg-black/30 backdrop-blur-lg border-b border-white/10 px-6 py-4 sticky top-0 z-10">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <a href="/" class="text-2xl font-bold hover:text-purple-300 transition">✨ BookGenie</a>
        
        <div class="flex gap-6 items-center">
            <a href="/genie"         class="text-gray-300 hover:text-white transition">Genie</a>
            <a href="/ask"           class="text-gray-300 hover:text-white transition">Ask AI</a>
            <a href="/liked"         class="text-gray-300 hover:text-white transition">Liked</a>
            <a href="/library"       class="text-gray-300 hover:text-white transition">Library</a>
            <a href="/profile"       class="text-gray-300 hover:text-white transition">Profile</a>
            <a href="/logout"        class="text-sm bg-white/10 hover:bg-white/20 px-3 py-1 rounded-lg transition">Logout</a>
        </div>
    </div>
</nav>


<!-- ─── MAIN CONTAINER ─── -->
<div class="max-w-5xl mx-auto px-6 py-8">
    
    <!-- Header -->
    <div class="text-center mb-8">
        <h1 class="text-4xl font-bold mb-3">🤖 Ask BookGenie AI</h1>
        <p class="text-gray-300 text-lg">Ask me anything about books, and I'll find the perfect recommendations for you!</p>
    </div>
    
    <!-- Example Questions -->
    <div id="examples" class="mb-8">
        <p class="text-sm text-gray-400 mb-3">Try asking:</p>
        <div class="flex flex-wrap gap-2">
            <button onclick="askExample(this)" class="text-sm bg-white/10 hover:bg-purple-600/40 px-4 py-2 rounded-full transition">
                Mystery books for beginners
            </button>
            <button onclick="askExample(this)" class="text-sm bg-white/10 hover:bg-purple-600/40 px-4 py-2 rounded-full transition">
                Books about World War II
            </button>
            <button onclick="askExample(this)" class="text-sm bg-white/10 hover:bg-purple-600/40 px-4 py-2 rounded-full transition">
                Happy romantic comedies
            </button>
            <button onclick="askExample(this)" class="text-sm bg-white/10 hover:bg-purple-600/40 px-4 py-2 rounded-full transition">
                Science fiction with strong female leads
            </button>
        </div>
    </div>
    
    <!-- Conversation Container -->
    <div id="conversation" class="space-y-6 mb-8 min-h-[300px]">
        <!-- Messages will appear here -->
    </div>
    
    <!-- Input Box -->
    <div class="sticky bottom-6 bg-white/5 backdrop-blur-lg rounded-2xl p-4 border border-white/10">
        <div class="flex gap-3">
            <input
                type="text"
                id="queryInput"
                placeholder="Ask me anything about books..."
                class="flex-1 px-4 py-3 rounded-lg bg-slate-800/50 border border-purple-500/30 focus:border-purple-500 focus:ring-2 focus:ring-purple-500/50 focus:outline-none text-white placeholder-slate-400"
            >
            <button
                onclick="askQuestion()"
                id="askBtn"
                class="px-6 py-3 bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 rounded-lg font-semibold transition disabled:opacity-50 disabled:cursor-not-allowed">
                Ask
            </button>
        </div>
    </div>
    
</div>


<!-- ─── JAVASCRIPT ─── -->
<script>
let conversationHistory = [];

function askExample(btn) {
    document.getElementById('queryInput').value = btn.textContent.trim();
    askQuestion();
}

async function askQuestion() {
    const input = document.getElementById('queryInput');
    const askBtn = document.getElementById('askBtn');
    const query = input.value.trim();
    
    if (!query) return;
    
    // Hide examples after first question
    document.getElementById('examples').style.display = 'none';
    
    // Add user message
    addMessage('user', query);
    
    // Clear input
    input.value = '';
    
    // Disable input
    input.disabled = true;
    askBtn.disabled = true;
    
    // Show typing indicator
    addTypingIndicator();
    
    try {
        const response = await fetch('/api/ask', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ query: query })
        });
        
        if (!response.ok) throw new Error('Request failed');
        
        const data = await response.json();
        
        // Remove typing indicator
        removeTypingIndicator();
        
        // Add AI response
        addMessage('assistant', data.response, data.books);
        
    } catch (error) {
        removeTypingIndicator();
        addMessage('assistant', 'Sorry, I encountered an error. Please try again.');
        console.error('Error:', error);
    } finally {
        input.disabled = false;
        askBtn.disabled = false;
        input.focus();
    }
}

function addMessage(role, content, books = []) {
    const container = document.getElementById('conversation');
    const messageDiv = document.createElement('div');
    messageDiv.className = `message-bubble ${role === 'user' ? 'flex justify-end' : 'flex justify-start'}`;
    
    if (role === 'user') {
        messageDiv.innerHTML = `
            <div class="bg-purple-600 px-5 py-3 rounded-2xl max-w-2xl">
                <p class="text-white">${escapeHtml(content)}</p>
            </div>
        `;
    } else {
        // Parse book IDs and make them clickable links
        let formattedContent = escapeHtml(content);
        formattedContent = formattedContent.replace(
            /\[Book ID:\s*(\d+)\]/g,
            '<span class="text-purple-300 font-semibold">[Book ID: $1]</span>'
        );
        
        messageDiv.innerHTML = `
            <div class="bg-white/10 px-5 py-3 rounded-2xl max-w-3xl">
                <div class="flex items-start gap-3">
                    <span class="text-2xl">🤖</span>
                    <div class="flex-1">
                        <p class="text-white whitespace-pre-wrap">${formattedContent}</p>
                        ${books.length > 0 ? renderBooks(books) : ''}
                    </div>
                </div>
            </div>
        `;
    }
    
    container.appendChild(messageDiv);
    messageDiv.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function renderBooks(books) {
    if (!books || books.length === 0) return '';
    
    return `
        <div class="mt-4 grid grid-cols-2 md:grid-cols-3 gap-3">
            ${books.map(book => `
                <a href="/book/${book.unique_values}" 
                   class="block bg-black/40 rounded-lg overflow-hidden hover:scale-105 transition">
                    <img src="${book.image || book.large_thumbnail || '/static/cover-not-found.jpg'}" 
                         alt="${escapeHtml(book.Title)}"
                         class="w-full h-40 object-cover"
                         onerror="this.src='/static/cover-not-found.jpg'">
                    <div class="p-2">
                        <p class="text-xs font-semibold line-clamp-2">${escapeHtml(book.Title)}</p>
                        <p class="text-xs text-gray-400 truncate">${escapeHtml(book.authors)}</p>
                    </div>
                </a>
            `).join('')}
        </div>
    `;
}

function addTypingIndicator() {
    const container = document.getElementById('conversation');
    const typingDiv = document.createElement('div');
    typingDiv.id = 'typing-indicator';
    typingDiv.className = 'message-bubble flex justify-start';
    typingDiv.innerHTML = `
        <div class="bg-white/10 px-5 py-3 rounded-2xl">
            <div class="flex items-center gap-3">
                <span class="text-2xl">🤖</span>
                <div class="typing-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    `;
    container.appendChild(typingDiv);
    typingDiv.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function removeTypingIndicator() {
    const typing = document.getElementById('typing-indicator');
    if (typing) typing.remove();
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Allow Enter key to ask
document.getElementById('queryInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        askQuestion();
    }
});

// Auto-focus input
window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('queryInput').focus();
});
</script>

</body>
</html>
